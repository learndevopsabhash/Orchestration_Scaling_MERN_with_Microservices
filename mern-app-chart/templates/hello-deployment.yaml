apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.helloService.replicaCount }}
  selector:
    matchLabels:
      app: hello-service
  template:
    metadata:
      labels:
        app: hello-service
    spec:
      containers:
        - name: hello-service
          image: "{{ .Values.helloService.image.repository }}:{{ .Values.helloService.image.tag }}"
          imagePullPolicy: {{ .Values.helloService.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.helloService.env.PORT | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.helloService.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10