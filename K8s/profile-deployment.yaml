apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: mern-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      containers:
        - name: profile-service
          image: 057079472578.dkr.ecr.ap-south-1.amazonaws.com/profile-service:1.0
          env:
            - name: PORT
              value: "3002"
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: profile-service-secret
                  key: MONGO_URL
          ports:
            - containerPort: 3002
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10